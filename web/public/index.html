<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Holistic Navigator</title>
  <meta name="description" content="Planificación de travesías oceánicas: rutas de World Cruising Routes, waypoints GPS, navegación y bitácora. Offline.">
  <meta name="theme-color" content="#0b1626">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0b1626; }
    #map { position: fixed; inset: 0; }
    #hn-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px;
      background: #0b1626; color: #e8f1fa;
      font-family: system-ui, sans-serif; transition: opacity .4s ease;
    }
    #hn-loading .t { font-size: 20px; letter-spacing: .06em; }
    #hn-loading .s { font-size: 12px; color: #6b7f96; }
    #hn-loading.done { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="hn-loading">
    <div class="t">Holistic Navigator</div>
    <div class="s">Cargando carta base…</div>
  </div>
  <script>
    // Diagnóstico de arranque en pantalla (temporal, W5.1): sin consola en el teléfono.
    (function () {
      var box = document.getElementById("hn-loading");
      var line = box && box.querySelector(".s");
      var t0 = Date.now();
      function say(msg) { if (line) line.textContent = msg; }
      function fail(msg) {
        if (!box) return;
        box.classList.remove("done");
        var p = document.createElement("div");
        p.className = "s"; p.style.color = "#ff8a80"; p.style.maxWidth = "90vw"; p.style.textAlign = "center";
        p.textContent = String(msg).slice(0, 220);
        box.appendChild(p);
      }
      window.addEventListener("error", function (e) { fail("Error: " + (e.message || e.type) + (e.filename ? " @" + e.filename.split("/").pop() + ":" + e.lineno : "")); });
      window.addEventListener("unhandledrejection", function (e) { var r = e.reason; fail("Promesa: " + (r && r.message ? r.message : r)); });
      var gl = null; try { gl = document.createElement("canvas").getContext("webgl2"); } catch (x) {}
      if (!gl) fail("Este navegador no tiene WebGL2: el mapa no puede dibujarse.");
      var want = ["main.js", "land.geojson", "graticule.geojson", "index.json", "basins.json", "routes.geojson"];
      var tick = setInterval(function () {
        if (!box || box.classList.contains("done")) { clearInterval(tick); return; }
        var done = performance.getEntriesByType("resource").map(function (r) { return r.name.split("/").pop().split("?")[0]; });
        var st = want.map(function (f) { return (done.indexOf(f) >= 0 ? "✓ " : "… ") + f; }).join("  ");
        say("Cargando " + Math.round((Date.now() - t0) / 1000) + " s  ·  " + st);
      }, 1000);
    })();
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
