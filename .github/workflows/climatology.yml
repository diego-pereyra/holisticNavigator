name: climatology
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/climatology/**'
      - '.github/workflows/climatology.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    env:
      CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
      EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/climatology/requirements.txt
      - name: Build climatology
        run: python tools/climatology/build_clim.py
      - name: Sync to web/public/clim
        run: bash scripts/sync-catalog.sh
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/clim/*.bin data/clim/clim.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            built=$(date -u +%Y-%m-%d)
            git commit -m "clim: climatología 1991-2020 ($built)"
            git push origin main
          fi
