name: Build PMTiles (world z6 + zonas)

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/tiles/**"

permissions:
  contents: write

jobs:
  tiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar pmtiles
        run: |
          set -euo pipefail
          url=$(curl -sL https://api.github.com/repos/protomaps/go-pmtiles/releases/latest \
            | grep -o 'https://[^"]*go-pmtiles_[^"]*_Linux_x86_64\.tar\.gz' | head -1)
          echo "binario: $url"
          curl -sL "$url" -o pmtiles.tar.gz
          tar xzf pmtiles.tar.gz pmtiles
          sudo mv pmtiles /usr/local/bin/pmtiles
          pmtiles version

      - name: Extraer el mundo hasta zoom 6
        run: |
          set -euo pipefail
          for d in 0 1 2; do
            day=$(date -u -d "-$d day" +%Y%m%d)
            echo "probando build $day"
            if pmtiles extract "https://build.protomaps.com/$day.pmtiles" world-z6.pmtiles --maxzoom=6; then
              echo "built=$day" >> "$GITHUB_ENV"
              echo "planet=https://build.protomaps.com/$day.pmtiles" >> "$GITHUB_ENV"
              break
            fi
          done
          test -f world-z6.pmtiles

      - name: Extraer las zonas descargables (E10.2)
        run: |
          set -euo pipefail
          mkdir -p zones
          echo "## Zonas de la carta detallada (E10.2)" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' > /tmp/zonas.tsv
          import json
          with open("tools/tiles/zones.json", encoding="utf-8") as f:
              data = json.load(f)
          for name, cfg in data.items():
              if "bbox" not in cfg:
                  continue
              w, s, e, n = cfg["bbox"]
              print("\t".join([name, str(w), str(s), str(e), str(n),
                               str(cfg.get("minzoom", 7)), str(cfg.get("maxzoom", 10))]))
          PY
          while IFS=$'\t' read -r id w s e n minz maxz; do
            [ -z "$id" ] && continue
            echo "extrayendo $id ($w,$s,$e,$n · z$minz..$maxz)"
            pmtiles extract "$planet" "zones/$id.pmtiles" \
              --bbox="$w,$s,$e,$n" --minzoom="$minz" --maxzoom="$maxz"
            size=$(stat -c%s "zones/$id.pmtiles")
            mb=$((size / 1024 / 1024))
            echo "- \`$id\`: ${mb} MB (${size} bytes)" >> "$GITHUB_STEP_SUMMARY"
            if [ "$size" -gt 83886080 ]; then
              echo "- advertencia: \`$id\` supera los 80 MB." >> "$GITHUB_STEP_SUMMARY"
            fi
          done < /tmp/zonas.tsv

      - name: Escribir tiles.json
        run: |
          set -euo pipefail
          base="${{ github.server_url }}/${{ github.repository }}/releases/download/tiles-latest"
          python3 - "$base" "$built" > tiles.json <<'PY'
          import hashlib, json, sys
          base, built = sys.argv[1], sys.argv[2]
          with open("tools/tiles/zones.json", encoding="utf-8") as f:
              cfg = json.load(f)

          def meta(path):
              with open(path, "rb") as fh:
                  data = fh.read()
              return len(data), hashlib.sha256(data).hexdigest()

          wb, wh = meta("world-z6.pmtiles")
          out = {
              "world": {"url": f"{base}/world-z6.pmtiles", "bytes": wb, "sha256": wh, "built": built},
              "zones": {},
          }
          for name, z in cfg.items():
              if "bbox" not in z:
                  continue
              b, h = meta(f"zones/{name}.pmtiles")
              out["zones"][name] = {
                  "nombre": z["nombre"],
                  "bbox": z["bbox"],
                  "bytes": b,
                  "sha256": h,
                  "url": f"{base}/zones/{name}.pmtiles",
              }
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
          cat tiles.json

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: tiles-latest
          name: "PMTiles (última)"
          make_latest: false
          overwrite_files: true
          files: |
            world-z6.pmtiles
            tiles.json
            zones/*.pmtiles
