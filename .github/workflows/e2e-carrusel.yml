name: e2e-carrusel
# Carrusel de Instagram: abre la app en un browser real, importa el GPX de
# AN98A (Cristobal → Miami) y deja las cuatro placas en un artefacto. No
# bloquea el deploy: se dispara a mano o cuando cambia el test o su GPX.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/e2e/**"
      - ".github/workflows/e2e-carrusel.yml"
      - "sponsors/IG/posteos/2026-11-11-costera/ruta-panama-miami.gpx"

jobs:
  carrusel:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Deps web + Playwright
        run: |
          cd web && npm ci && npm i --no-save playwright
          # ubuntu-latest ya trae Chromium y sus libs; `--with-deps` dispara apt
          # y puede colgarse. Un timeout evita bloquear el workflow por la red.
          timeout 180 npx playwright install chromium || echo "chromium ya presente o sin red (sigo)"
      - name: Build
        run: bash scripts/build-web.sh
      - name: Teselas de la release (para que la carta de detalle no dé 404)
        run: |
          # Misma robustez que el deploy: durante el reemplazo de la release
          # `tiles-latest` el asset puede dar 404/parcial por un instante.
          RETRY=(--retry 6 --retry-delay 10 --retry-all-errors)
          mkdir -p web/dist/tiles/zones
          curl -fsSL "${RETRY[@]}" -o web/dist/tiles/tiles.json \
            https://github.com/diego-pereyra/holisticNavigator/releases/download/tiles-latest/tiles.json \
            || echo "aviso: sin tiles.json; el carrusel sigue"
          curl -fsSL "${RETRY[@]}" -o web/dist/tiles/world-z6.pmtiles \
            https://github.com/diego-pereyra/holisticNavigator/releases/download/tiles-latest/world-z6.pmtiles \
            || echo "aviso: sin teselas; el carrusel sigue con el piso Natural Earth"
          ls -l web/dist/tiles/world-z6.pmtiles || true
      - name: Servir con HTTP Range (como Pages)
        run: |
          mkdir -p /tmp/site && ln -s "$PWD/web/dist" /tmp/site/holisticNavigator
          python3 scripts/serve-range.py 8087 /tmp/site >/dev/null 2>&1 &
          sleep 2
      - name: Carrusel IG (4 placas)
        run: node web/e2e/carrusel-ig.mjs http://localhost:8087/holisticNavigator/ e2e-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carrusel-ig
          path: e2e-screenshots
          if-no-files-found: warn
