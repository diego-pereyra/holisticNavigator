name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - run: bash scripts/build-web.sh
      - run: bash scripts/budget.sh
      - name: Copiar las teselas de la carta de detalle al sitio (E10.1b, E10.2, E10.3)
        run: |
          # El workflow de teselas puede estar reemplazando los assets de la
          # release tiles-latest al mismo tiempo (los dos corren en el mismo
          # push): durante el reemplazo la URL da 404 un instante, así que se
          # reintenta.
          RETRY=(--retry 6 --retry-delay 10 --retry-all-errors)
          mkdir -p web/dist/tiles/zones
          curl -fsSL "${RETRY[@]}" -o web/dist/tiles/tiles.json \
            https://github.com/diego-pereyra/holisticNavigator/releases/download/tiles-latest/tiles.json
          curl -fsSL "${RETRY[@]}" -o web/dist/tiles/world-z6.pmtiles \
            https://github.com/diego-pereyra/holisticNavigator/releases/download/tiles-latest/world-z6.pmtiles
          # Zonas descargables (E10.2): se copian las que ya estén en la release.
          # GitHub aplana los assets, así que en la release la zona es
          # `<id>.pmtiles` (no `zones/<id>.pmtiles`). Si el workflow de teselas
          # todavía no las publicó, el deploy sigue.
          ids=$(python3 -c 'import json; print(" ".join(json.load(open("web/dist/tiles/tiles.json")).get("zones", {}).keys()))')
          for id in $ids; do
            echo "copiando zona $id"
            curl -fsSL "${RETRY[@]}" -o "web/dist/tiles/zones/$id.pmtiles" \
              "https://github.com/diego-pereyra/holisticNavigator/releases/download/tiles-latest/$id.pmtiles" \
              || echo "aviso: la zona $id todavía no está en la release; queda sin copiar"
          done
          # Balizas sin red (E10.3): <id>-seamarks.geojson, si la zona lo trae.
          sids=$(python3 -c 'import json; d=json.load(open("web/dist/tiles/tiles.json")); print(" ".join(k for k, v in d.get("zones", {}).items() if v.get("seamarks")))')
          for id in $sids; do
            echo "copiando balizas $id"
            curl -fsSL "${RETRY[@]}" -o "web/dist/tiles/zones/$id-seamarks.geojson" \
              "https://github.com/diego-pereyra/holisticNavigator/releases/download/tiles-latest/$id-seamarks.geojson" \
              || echo "aviso: las balizas de $id todavía no están en la release; quedan sin copiar"
          done

      - name: Smoke test en browser real (bloquea el deploy si la app no arranca)
        run: |
          cd web && npm i --no-save playwright && npx playwright install --with-deps chromium && cd ..
          mkdir -p /tmp/site && ln -s "$PWD/web/dist" /tmp/site/holisticNavigator
          # El smoke sirve la dist con un servidor que soporta HTTP Range: las
          # teselas PMTiles se piden por rangos (206) y `python3 -m http.server`
          # no los soporta (responde 200 con el archivo entero, el fetch se
          # aborta y Playwright lo marca como requestfailed). Pages sí soporta
          # rangos, así que el smoke imita a Pages.
          python3 scripts/serve-range.py 8087 /tmp/site >/dev/null 2>&1 &
          sleep 2
          node web/smoke.mjs http://localhost:8087/holisticNavigator/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshot
          path: smoke.png
          if-no-files-found: ignore
      - run: |
          OUT=web/dist
          find "$OUT" -name '*.map' -delete
          touch "$OUT/.nojekyll"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
