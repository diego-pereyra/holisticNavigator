<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Holistic Navigator</title>
  <meta name="description" content="Planificación de travesías oceánicas: rutas de World Cruising Routes, waypoints GPS, navegación y bitácora. Offline.">
  <meta name="theme-color" content="#0b1626">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Holistic Navigator">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b1626; overflow: hidden; }
    #ComposeTarget { width: 100%; height: 100%; display: block; }
    #hn-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px;
      align-items: center; justify-content: center; background: #0b1626; color: #7fb3e8;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; transition: opacity .4s ease;
    }
    #hn-loading .t { font-size: 20px; letter-spacing: .06em; color: #e8f1fa; }
    #hn-loading .s { font-size: 12px; color: #6b7f96; }
    #hn-loading.done { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="ComposeTarget"></canvas>
  <div id="hn-loading">
    <div class="t">Holistic Navigator</div>
    <div class="s">Cargando cartas y catálogo…</div>
  </div>
  <script type="module" src="composeApp.js"></script>
  <script>
    function hnReady() {
      var el = document.getElementById('hn-loading');
      if (el) el.classList.add('done');
    }
    window.addEventListener('load', function () { setTimeout(hnReady, 400); });
    setTimeout(hnReady, 15000);
  </script>
</body>
</html>
